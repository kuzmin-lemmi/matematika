name: Публикация на GitHub Pages

# Пока сайт не опубликован, сборка запускается только вручную (вкладка Actions → Run workflow).
# Когда автор включит Pages (Settings → Pages → Source: GitHub Actions), добавить запуск по push в main:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
