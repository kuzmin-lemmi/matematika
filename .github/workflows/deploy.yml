name: Публикация на GitHub Pages

# Сайт опубликован на https://matshag.ru. Публикация запускается вручную (вкладка Actions → Run workflow)
# или командой конструктора `npm run publish`. Автопубликацию по push в main включает только автор
# (docs/ROADMAP.md, этап 4) — для этого добавить:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
