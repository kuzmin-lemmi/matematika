name: Публикация на GitHub Pages

# Сайт опубликован на https://matshag.ru. Публикация запускается вручную (вкладка Actions → Run workflow)
# или командой конструктора `npm run publish`. Автопубликацию по push в main включает только автор
# (docs/ROADMAP.md, этап 4) — для этого добавить:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две публикации подряд не толкаются: вторая ждёт первую
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Типы, тесты материалов и карточек — до публикации, а не после
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - uses: withastro/action@v6
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
